# The Node test map of design 0001 phase 2 (plan section 6.3), checked by test_node_test_map.py, whose docstring
# defines the keys and the fields.
#
# [sites] has one entry per test( / dataTest( call site in the webapp/scripts/check-*.mjs files that import
# node:test, grouped by file in source order. While phase 2 ran, a port that belonged to a later slice was "pending"
# with its slice and module, and a site that stays in Node but had to change for the Python service was "NA"; slice 10
# (the last) left neither: every site is ported (P), mirrored (C), stays in Node (N, E, CLI) or is dropped (D). A Node
# test removed with the public-service interface in slice 10 left the map with its site.
#
# Reason codes for D (plan section 5.1): R1 anonymous public visitors (networks, cookies, signed sessions, rate
# limits, per-browser ownership); R2 operations logging, admission and monitoring, and the operator probe; R3 hosted
# proxy access policy; R4 public library moderation and owner scopes; R5 project credentials; R6 operator
# maintenance mode for hosted backup and restore; R7 transfer optimisation that loopback does not need.
#
# [scripts] lists the opt-in live and Playwright scripts (no node:test) with the slice that retargets them to the
# Python service.

