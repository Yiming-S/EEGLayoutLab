name: Website

# Builds the website and deploys it to GitHub Pages: the read-only showcase (docs/showcase.md) at the
# root and the documentation site (mkdocs.yml) under /docs/. Runs on every push to main and by hand.
# Needs Pages enabled with "GitHub Actions" as the source and the custom domain (eeglayout.org) set in
# the Pages settings and as the repository variable SHOWCASE_CNAME: the showcase must be served at a
# domain root.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a custom domain
        env:
          SHOWCASE_CNAME: ${{ vars.SHOWCASE_CNAME }}
        run: |
          if [ -z "$SHOWCASE_CNAME" ]; then
            echo "Set the repository variable SHOWCASE_CNAME; the showcase must be served at a domain root." >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install locked web dependencies
        working-directory: webapp
        run: npm ci
      - name: Check interface types, lint and showcase tooling
        working-directory: webapp
        run: |
          npm run typecheck
          npm run lint
          node --test scripts/check-showcase.mjs scripts/check-i18n.mjs
      - name: Build the showcase
        working-directory: webapp
        run: npm run build:showcase
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install the pinned site generator
        run: python -m pip install -r docs/requirements.txt
      - name: Build the documentation under /docs/
        env:
          # Links to repository files point to the commit that was built.
          DOCS_SOURCE_REF: ${{ github.sha }}
          DOCS_SITE_URL: https://${{ vars.SHOWCASE_CNAME }}/docs/
          NO_MKDOCS_2_WARNING: '1'
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/docs-versions; then
            mkdir -p webapp/showcase-dist/docs
            git archive origin/docs-versions docs | tar -x -C webapp/showcase-dist
            mkdocs build --strict --site-dir webapp/showcase-dist/docs/dev
          else
            mkdocs build --strict --site-dir webapp/showcase-dist/docs
          fi
      - name: Write the custom domain
        env:
          SHOWCASE_CNAME: ${{ vars.SHOWCASE_CNAME }}
        run: printf '%s\n' "$SHOWCASE_CNAME" > webapp/showcase-dist/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/showcase-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
