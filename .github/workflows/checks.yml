name: Fast checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    # Supported Python is 3.11-3.13 (pyproject.toml). macOS arm64 is checked locally until the repository is
    # public; a private repository pays more for macOS runner minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Confirm scientific payloads and native environments are absent
        run: test ! -e results && test ! -e data/external && test ! -e .runtime
      - name: Install locked web dependencies
        working-directory: webapp
        run: npm ci
      - name: Check types, lint, synthetic services and browser asset contracts
        working-directory: webapp
        run: |
          npm run typecheck
          npm run lint
          npm run test:fast
          npm run build
      - name: Install Python source-test dependencies
        run: python -m pip install -e '.[dev,service]'
      - name: Check Python without the external scientific bundle
        env:
          # The schema and key parity tests (tests/test_schema_*.py, tests/service) compare with Node; here they
          # must run, not skip. On Linux the key parity also covers the interpreter fingerprint of python3.
          EEG_REQUIRE_SCHEMA_PARITY: '1'
        run: python -m pytest -m 'not data_bundle and not native_runtime' -q
