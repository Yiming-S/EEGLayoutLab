name: Fast checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Confirm scientific payloads and native environments are absent
        run: test ! -e results && test ! -e data/external && test ! -e .runtime
      - name: Install locked web dependencies
        working-directory: webapp
        run: npm ci
      - name: Check types, lint, synthetic services and browser asset contracts
        working-directory: webapp
        run: |
          npm run typecheck
          npm run lint
          npm run test:fast
          npm run build
      - name: Install Python source-test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check Python without the external scientific bundle
        run: python -m pytest -m 'not data_bundle and not native_runtime' -q
