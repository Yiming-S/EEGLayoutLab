<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    .plaque { fill: #FDFCFA; stroke: #D2CFC5; }
    .sphere { stroke: #18181B; }
    .meridian { stroke: rgba(24, 24, 27, 0.36); }
    .sector { fill: rgba(36, 81, 216, 0.2); }
    .patch { stroke: #2451D8; }
    @media (prefers-color-scheme: dark) {
      .plaque { fill: #1C1C20; stroke: rgba(255, 255, 255, 0.16); }
      .sphere { stroke: #F3F1EC; }
      .meridian { stroke: rgba(243, 241, 236, 0.36); }
      .sector { fill: rgba(96, 165, 250, 0.26); }
      .patch { stroke: #60A5FA; }
    }
  </style>
  <rect x="2" y="2" width="60" height="60" rx="15" stroke-width="2.4" class="plaque" />
  <g transform="rotate(-22 32 32)">
    <path d="M 32 11.5 A 20.5 20.5 0 0 1 52.5 32 A 20.5 8.5 0 0 0 40.81 24.32 A 9.5 20.5 0 0 0 32 11.5 Z" class="sector" />
    <circle cx="32" cy="32" r="20.5" stroke-width="2.8" class="sphere" />
    <ellipse cx="32" cy="32" rx="9.5" ry="20.5" stroke-width="2.2" class="meridian" />
    <ellipse cx="32" cy="32" rx="20.5" ry="8.5" stroke-width="2.2" class="meridian" />
    <path d="M 32 11.5 A 20.5 20.5 0 0 1 52.5 32" stroke-width="5.4" stroke-linecap="round" class="patch" />
  </g>
</svg>
