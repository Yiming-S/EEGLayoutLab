[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compact-eeg"
version = "0.2.0"
description = "EEGLayoutLab fixed-64 EEG layout research application"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11,<3.12"
dependencies = [
  "matplotlib==3.10.8",
  "numpy==2.3.0",
  "scipy==1.17.1",
  "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
# The local service and its request schemas (src/eeglayoutlab); the science code does not need them.
service = [
  "fastapi==0.165.0",
  "pydantic==2.14.4",
  "starlette==1.10.0",
  "uvicorn==0.54.0",
]
dev = ["httpx==0.28.1", "pytest==9.0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
markers = [
  "data_bundle: requires the separately restored scientific data bundle",
  "native_runtime: requires the separately installed native scientific runtime",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
